name: 旧版 Keeper 反编译修补

# 全部跑在公开仓库的 GitHub-hosted runner 容器里,不占用私有仓库的 Actions 额度。
# 流程: 编译 legacy/native -> apktool 反编译原版 APK -> 替换 4 个 native 资源
#       -> 覆盖历史补丁基线 -> 跑本轮四项修补 -> 重打包 -> 签名 -> 校验 -> 上传
on:
  push:
    paths:
      - 'legacy/**'
      - '.github/workflows/build-legacy.yml'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 NDK r27c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # 精简版: keeper.bin (加载器) + keeper.so (sweep/revive/guard 三合一)
      - name: 编译 native
        run: bash legacy/native/build/build_legacy.sh

      - name: 反编译原版 APK
        run: |
          java -jar legacy/tools/apktool.jar d legacy/original/Keeper.apk -o build/dec -f

      # 用新 native 覆盖原版 assets/sk/*
      # keeper.bin -> boot; keeper.so -> 三个 payload 名字(同一份内容, sk_core 按 entry 分派)
      - name: 替换 native 资源
        run: |
          cp legacy/native/_legacy_out/keeper.bin build/dec/assets/sk/boot
          cp legacy/native/_legacy_out/keeper.so  build/dec/assets/sk/sk_sweep.so
          cp legacy/native/_legacy_out/keeper.so  build/dec/assets/sk/sk_revive.so
          cp legacy/native/_legacy_out/keeper.so  build/dec/assets/sk/sk_guard.so
          ls -l build/dec/assets/sk/

      # legacy/patches 里的两个 smali 是「历史补丁基线」(通知权限、快速清场、
      # 卸载重装、shrun 调用逻辑等),不是原版。先覆盖,再跑本轮四项修补。
      - name: 应用补丁
        run: |
          cp legacy/patches/Payloads.smali     build/dec/smali/com/sk/keeper/Payloads.smali
          cp legacy/patches/MainActivity.smali build/dec/smali/com/sk/keeper/MainActivity.smali
          python3 legacy/patches/apply_fixes.py build/dec legacy/assets/sk/shrun

      - name: 重打包
        run: |
          java -jar legacy/tools/apktool.jar b build/dec -o build/Keeper_legacy_unsigned.apk

      # uber-apk-signer 不传 --ks 时会用内置的标准 Android debug keystore,
      # 每次构建证书一致,新版可以直接覆盖安装,不用先卸载。
      - name: 签名
        run: |
          java -jar legacy/tools/uber-apk-signer.jar \
            -a build/Keeper_legacy_unsigned.apk --allowResign -o build/out

      # 关键校验:
      #  1. 4 个 native 必须 STORED(加载器 sk_zip_extract 只认 method=0)
      #  2. 字节必须和 _legacy_out 完全一致(确认替换生效)
      #  3. shrun 与 dex 补丁仍在
      - name: 校验产物
        run: |
          python3 - <<'PY'
          import glob, os, zipfile
          p = glob.glob('build/out/*debugSigned.apk')[0]
          a = zipfile.ZipFile(p)
          n = set(a.namelist())
          assert 'assets/sk/shrun' in n, 'shrun 没进包'
          d = a.read('classes.dex')
          assert b'sk/shrun' in d and b'state/no_pull' in d, '补丁没进 dex'
          want = {
              'assets/sk/boot':        'legacy/native/_legacy_out/keeper.bin',
              'assets/sk/sk_sweep.so': 'legacy/native/_legacy_out/keeper.so',
              'assets/sk/sk_revive.so':'legacy/native/_legacy_out/keeper.so',
              'assets/sk/sk_guard.so': 'legacy/native/_legacy_out/keeper.so',
          }
          for name, src in want.items():
              i = a.getinfo(name)
              assert i.compress_type == 0, name + ' 被压缩了'
              raw = open(src, 'rb').read()
              assert i.file_size == len(raw), name + ' 大小不一致'
              assert a.read(name) == raw, name + ' 内容不一致'
          print('OK', p, a.getinfo('assets/sk/shrun').file_size,
                {k: a.getinfo(k).file_size for k in want})
          PY

      - name: 上传签名 APK
        uses: actions/upload-artifact@v4
        with:
          name: keeper-legacy-patched
          path: build/out/*debugSigned.apk
          retention-days: 30
